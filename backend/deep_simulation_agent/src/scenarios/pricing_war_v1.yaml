game_rules:
  crisis_trigger_chance: 0.28
  daily_base_points: 0.9
  move_points_per_step: 0.08
  intent_points_multiplier: 1.9
  kpi_points_multiplier: 0.75
crisis_cards:
  - id: rival_discount_war
    title: Rival Discount War
    effects:
      revenue: -0.35
      churn_risk: 0.5
    counter_actions:
      - campaign
      - spend_shift
  - id: supply_shock
    title: Supply Shock
    effects:
      margin: -0.48
      revenue: -0.18
    counter_actions:
      - procurement
  - id: social_backlash
    title: Social Backlash
    effects:
      sentiment: -0.6
      churn_risk: 0.3
    counter_actions:
      - campaign
  - id: policy_shift
    title: Policy Shift
    effects:
      margin: -0.24
      churn_risk: 0.2
    counter_actions:
      - move
      - spend_shift
notes:
  - 1 tick equals 1 day.
  - Active personas roll and move to a district each day.
  - District effects always apply.
  - Crisis cards may trigger and can be mitigated by counter actions.
  - Agent points rank strategic contribution over time.
shared_allowlist:
  - companies
  - market
  - reports
